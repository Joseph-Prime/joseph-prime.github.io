<!DOCTYPE html>

<html>
<title>W3.CSS Coming Soon Template</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">

<style>
body,html {height:100%}

.bgimg {
  background-image:url('/imgs/Logo.jpg');
  min-height:100%;
  background-position:center;
  background-size:cover;
}

@font-face {
  font-family: "Monocraft";
  src: url("https://raw.githubusercontent.com/IdreesInc/Monocraft/main/dist/Monocraft-ttf/Monocraft.ttf")
       format("truetype");
  font-display: swap;
}

body, h1 {
  font-family: "Monocraft", monospace;
}
</style>

<body>

<div class="bgimg w3-display-container w3-animate-opacity w3-text-white">

  <div class="w3-display-topleft w3-padding-large w3-xlarge">
    <img src="imgs/FeoStudios.png" alt="Logo" width="100" onclick="window.location.href='index.html'" onmouseover="this.style.cursor='pointer'">
  </div>

  <div class="w3-display-middle">
    <h1 class="w3-jumbo w3-animate-top">COMING SOON</h1>
    <hr class="w3-border-grey" style="margin:auto;width:40%">
    <p class="w3-large w3-center">35 days left</p>
  </div>

  <div class="w3-display-bottomleft w3-padding-large">
    Powered by
    <a href="https://www.w3schools.com/w3css/default.asp" target="_blank">w3.css</a>
  </div>

</div>

</body>
</html>
